# 复制成 deploy/secrets/dsh-config.yaml（.gitignore 已挡），或由 scripts/deploy.sh 从 secrets/.env.secret 生成
apiVersion: v1
kind: Secret
metadata: {name: dsh-config, namespace: ${NS_APP}}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "sk-xxxx"
  # SRE 的 DSH 凭据文件（与上面同一个 key 即可）
  .credentials.yaml: |
    DEEPSEEK_API_KEY: sk-xxxx
