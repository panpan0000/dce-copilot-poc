apiVersion: v1
kind: ConfigMap
metadata:
  name: dce-jwks
  namespace: ${NS_APP}
data:
  jwks.json: '${JWKS_INLINE}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-adapter
  namespace: ${NS_APP}
  labels: {app: substrate-adapter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: substrate-adapter}
  template:
    metadata:
      labels: {app: substrate-adapter}
    spec:
      containers:
        - name: adapter
          image: ${IMAGE_ADAPTER}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9099}
          env:
            # 服务端对 Actor 派生的会话；不参与 seed，换会话用 conversation_id
            - {name: ADAPTER_ADDR, value: ":9099"}
            - {name: JWKS_FILE, value: /etc/adapter/jwks.json}
            - {name: JWT_ISSUER, value: "${JWT_ISSUER}"}
            - {name: JWT_AUDIENCE, value: "${JWT_AUDIENCE}"}
            - {name: DCE_URL, value: "${DCE_ORIGIN}"}
            - {name: DCE_CLUSTER, value: "${DCE_CLUSTER}"}
            # kagent 1.0 的 A2A 入口是 /agents/<namespace>/<agent>（0.10 是 /api/a2a-sandboxes/...）
            - {name: UPSTREAM, value: "http://kagent-controller.${NS_KAGENT}.svc.cluster.local:8083/agents/${NS_KAGENT}/${AGENT_NAME}"}
            # 1.0 的 Session 由服务端创建，本地推导的 sid 只是逻辑会话键；
            # 映射（sid -> 上游 contextId）落盘，适配器重启后同一个会话不会被拆成两个沙箱。
            - {name: SESSION_MAP_FILE, value: "/data/adapter-sessions.json"}
          volumeMounts:
            - {name: jwks, mountPath: /etc/adapter, readOnly: true}
            - {name: sessions, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: 9099}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 9099}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: jwks
          configMap: {name: dce-jwks}
        - name: sessions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: substrate-adapter
  namespace: ${NS_APP}
spec:
  selector: {app: substrate-adapter}
  ports:
    - {name: http, port: 9099, targetPort: 9099}
